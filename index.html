<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Phillip Store</title>


    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <!-- TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>


    <!-- App stylesheet -->
    <link rel="stylesheet" href="style.css?v=9">

</head>


<body>


<div class="app">


    <!-- ============================== -->
    <!-- TOP BAR -->
    <!-- ============================== -->

    <header class="topbar">

        <div>

            <div class="brand">
                Phillip Store
            </div>

            <div class="subtitle">
                Simple • Secure • Fast
            </div>

        </div>


        <!-- Cart button -->

        <button
            id="cartButton"
            class="cart-button"
            type="button">

            🛒

            <span id="cartCount">
                0
            </span>

        </button>

    </header>



    <main>


        <!-- ============================== -->
        <!-- WELCOME -->
        <!-- ============================== -->

        <section class="welcome">

            <h1>
                Welcome 👋
            </h1>

            <p>
                Choose a product below.
            </p>


            <!-- TON wallet connection -->

            <div id="ton-connect"></div>

        </section>



        <!-- ============================== -->
        <!-- PRODUCTS -->
        <!-- ============================== -->

        <section
            id="products"
            class="products">


            <!-- T-Shirt -->

            <article class="product">

                <div class="product-image">
                    👕
                </div>


                <div class="product-info">

                    <h2>
                        T-Shirt
                    </h2>

                    <p>
                        Comfortable everyday T-shirt.
                    </p>


                    <div class="product-bottom">

                        <strong>
                            2,000 UGX
                        </strong>


                        <button
                            class="add-button"
                            type="button"
                            onclick="addToCart('T-Shirt', 2000)">

                            Add

                        </button>

                    </div>

                </div>

            </article>



            <!-- Headphones -->

            <article class="product">

                <div class="product-image">
                    🎧
                </div>


                <div class="product-info">

                    <h2>
                        Headphones
                    </h2>

                    <p>
                        Wireless headphones for music.
                    </p>


                    <div class="product-bottom">

                        <strong>
                            2,500 UGX
                        </strong>


                        <button
                            class="add-button"
                            type="button"
                            onclick="addToCart('Headphones', 2500)">

                            Add

                        </button>

                    </div>

                </div>

            </article>



            <!-- Phone Case -->

            <article class="product">

                <div class="product-image">
                    📱
                </div>


                <div class="product-info">

                    <h2>
                        Phone Case
                    </h2>

                    <p>
                        Protective phone case.
                    </p>


                    <div class="product-bottom">

                        <strong>
                            1,500 UGX
                        </strong>


                        <button
                            class="add-button"
                            type="button"
                            onclick="addToCart('Phone Case', 1500)">

                            Add

                        </button>

                    </div>

                </div>

            </article>


        </section>



        <!-- ============================== -->
        <!-- SHOPPING CART -->
        <!-- ============================== -->

        <section
            id="cart"
            class="cart hidden">


            <div class="cart-header">

                <h2>
                    Your Cart
                </h2>


                <button
                    id="closeCartButton"
                    class="close-button"
                    type="button">

                    ✕

                </button>

            </div>



            <!-- Cart products -->

            <div id="cartItems"></div>



            <!-- Cart total -->

            <div class="cart-total">

                <span>
                    Total
                </span>


                <strong id="cartTotal">
                    0 UGX
                </strong>

            </div>



            <!-- Checkout -->

            <button
                id="checkoutButton"
                class="checkout-button"
                type="button">

                Continue to Checkout

            </button>


        </section>


    </main>


</div>



<!-- ============================== -->
<!-- APP JAVASCRIPT -->
<!-- ============================== -->

<script src="app.js?v=9"></script>


</body>

</html>
