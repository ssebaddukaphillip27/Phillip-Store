<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Phillip Store</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="topbar">
        <div>
            <div class="brand">Phillip Store</div>
            <div class="subtitle">Simple • Secure • Fast</div>
        </div>

        <button id="cartButton" class="cart-button">
            🛒 <span id="cartCount">0</span>
        </button>
    </header>


    <main>

        <section class="welcome">
            <h1>Welcome 👋</h1>
            <p>Choose a product below.</p>
        </section>


        <section id="products" class="products">

            <article class="product">
                <div class="product-image">👕</div>

                <div class="product-info">
                    <h2>T-Shirt</h2>
                    <p>Comfortable everyday T-shirt.</p>

                    <div class="product-bottom">
                        <strong>35,000 UGX</strong>

                        <button
                            class="add-button"
                            onclick="addToCart('T-Shirt', 35000)">
                            Add
                        </button>
                    </div>
                </div>
            </article>


            <article class="product">
                <div class="product-image">🎧</div>

                <div class="product-info">
                    <h2>Headphones</h2>
                    <p>Wireless headphones for music.</p>

                    <div class="product-bottom">
                        <strong>80,000 UGX</strong>

                        <button
                            class="add-button"
                            onclick="addToCart('Headphones', 80000)">
                            Add
                        </button>
                    </div>
                </div>
            </article>


            <article class="product">
                <div class="product-image">📱</div>

                <div class="product-info">
                    <h2>Phone Case</h2>
                    <p>Protective phone case.</p>

                    <div class="product-bottom">
                        <strong>20,000 UGX</strong>

                        <button
                            class="add-button"
                            onclick="addToCart('Phone Case', 20000)">
                            Add
                        </button>
                    </div>
                </div>
            </article>

        </section>


        <section id="cart" class="cart hidden">

            <div class="cart-header">
                <h2>Your Cart</h2>

                <button onclick="closeCart()" class="close-button">
                    ✕
                </button>
            </div>

            <div id="cartItems"></div>

            <div class="cart-total">
                <span>Total</span>
                <strong id="cartTotal">0 UGX</strong>
            </div>

            <button
                id="checkoutButton"
                class="checkout-button"
                onclick="checkout()">
                Continue to Checkout
            </button>

        </section>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
